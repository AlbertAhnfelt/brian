name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `wrangler types --check` includes .dev.vars keys; CI has no secrets, so use the examples.
      - name: Use example dev vars
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars

      - run: pnpm check
      - run: pnpm test
