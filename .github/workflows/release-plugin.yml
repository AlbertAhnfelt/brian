name: Release Obsidian plugin

# Started by `pnpm release:plugin x.y.z`, which pushes a tag named exactly like the version.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches the manifest
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main."; exit 1; }
          version=$(node -p "require('./apps/obsidian/manifest.json').version")
          [ "$version" = "$TAG" ] || { echo "::error::Tag $TAG but apps/obsidian/manifest.json says $version."; exit 1; }

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same checks as CI: never release a plugin whose tests fail.
      - name: Use example dev vars
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars
      - run: pnpm check
      - run: pnpm test

      - run: pnpm --filter @brian/obsidian build

      # The release first, then the root manifest: Obsidian must never see a version without its release.
      - name: Publish the release
        run: |
          mkdir release
          cp apps/obsidian/dist/main.js apps/obsidian/manifest.json release/
          gh release create "$TAG" release/main.js release/manifest.json --title "$TAG" --generate-notes --verify-tag

      - name: Point Obsidian at the new version (root manifest.json on main)
        run: |
          cp apps/obsidian/manifest.json /tmp/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main
            cp /tmp/manifest.json manifest.json
            git add manifest.json
            git diff --cached --quiet && exit 0
            git commit --quiet -m "Publish Obsidian plugin $TAG"
            git push --quiet origin main && exit 0
            git reset --quiet --hard origin/main
          done
          echo "::error::Couldn't push manifest.json to main. The release exists; copy apps/obsidian/manifest.json to the root by hand."
          exit 1
